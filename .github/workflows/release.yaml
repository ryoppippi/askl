name: tagpr

on:
  push:
    branches:
      - main
  # Toggling tagpr:minor / tagpr:major labels on the release PR should update
  # its proposed version right away, instead of waiting for the next push to
  # main to make tagpr recompute it.
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency: tagpr

jobs:
  tagpr:
    # Label events only matter on tagpr's own release PR; skip the rest so
    # ordinary PR labelling doesn't spend runner time.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      # persist-credentials stays on (default) so tagpr can push the release PR and tag
      # ref: main because on pull_request events the default checkout is the
      # PR merge ref, while tagpr always operates on the release branch.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This release job runs in this workflow instead of a tag-triggered one
  # because tags pushed with GITHUB_TOKEN do not trigger `on: push: tags`
  # workflows. It runs only when tagpr just tagged a release-PR merge, and
  # checks out that tag explicitly. To retry a failed release, re-run this job:
  # a full re-run finds no new tag and skips it.
  release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Tag must match the version in package.json
        run: |
          v=$(jq -r .version package.json)
          if [ "v$v" != "${{ needs.tagpr.outputs.tag }}" ]; then
            echo "package.json version is $v but tag is ${{ needs.tagpr.outputs.tag }}" >&2
            exit 1
          fi

      - name: Build binaries for all targets
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            out="dist/askl-$t"
            [ "$t" = "windows-x64" ] && out="$out.exe"
            bun build src/cli/index.ts --compile --define 'import.meta.vitest=undefined' --target="bun-$t" --outfile "$out"
          done
          ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 askl-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        run: gh release create "${{ needs.tagpr.outputs.tag }}" dist/* --title "${{ needs.tagpr.outputs.tag }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
