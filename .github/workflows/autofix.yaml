name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - name: Install dependencies
        # postinstall regenerates nix/bun.nix from bun.lock.
        run: nix develop --command bun install --frozen-lockfile
      - name: Format
        # Unfixable errors are reported by the CI workflow; this job only pushes what can be fixed.
        continue-on-error: true
        run: nix develop --command bun run format
      - name: Drop changes under .github
        # autofix.ci rejects the entire fix if it contains a .github path.
        run: git restore --worktree -- .github
      - name: Push fixes with autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          fail-fast: false
          commit-message: 'chore: autofix'
