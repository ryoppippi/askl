name: Setup Nix with store cache
description: Install Nix with the shared automatic cache

runs:
  using: composite
  steps:
    - name: Setup Nix
      uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
      with:
        cache: auto
        sticky-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
